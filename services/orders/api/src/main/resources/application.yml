server:
  port: 5001

spring:
  application:
    name: orders-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/quickbite_orders
  datasource:
    url: jdbc:postgresql://localhost:5432/quickbite_orders
    username: quickbite
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

# Actuator & Observability Configuration
management:
  metrics:
    tags:
      application: orders-service
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0 # Sample 100% of requests for local development & debugging
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans # URL of your local Zipkin container

# Trace & Span ID in Logs
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{traceId:-},%X{spanId:-}] [%thread] %-5level %logger{36} - %msg%n"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html