server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: catalogs-service
          uri: http://localhost:5002
          predicates:
            - Path=/api/v1/catalogs, /api/v1/catalogs/**

        - id: orders-service
          uri: http://localhost:5001
          predicates:
            - Path=/api/v1/orders, /api/v1/orders/**

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, gateway
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0 # 100% sample rate for local testing
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{traceId:-},%X{spanId:-}] [%thread] %-5level %logger{36} - %msg%n"